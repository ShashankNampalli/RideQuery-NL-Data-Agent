[project]
name = "ride-query"
version = "0.1.0"
description = "RideQuery: NL Data Agent — natural-language SQL and ETL for rideshare data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nl_data_agent*"]
